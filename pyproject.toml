[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-scratch"
version = "0.1.0"
requires-python = ">=3.9"

dependencies = [
    # 核心依赖
    "transformers>=4.37.0",
    "torch"
]

[project.optional-dependencies]
# 搜索功能依赖
train = [
    "swanlab",
    "accelerate>=0.26.0",
    "loguru",
    "datasets"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_scratch*"]
exclude = ["tests*"]

