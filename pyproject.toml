[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-scratch"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
    # 核心依赖
    "transformers>=4.37.0",
    "torch"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["llm_scratch*"]
exclude = ["tests*"]

